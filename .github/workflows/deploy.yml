name: Deploy

# Production deployment, driven from this workflow rather than by Vercel's Git
# integration.
#
# That is a deliberate choice and it has a cost worth stating. Vercel can deploy on push by
# itself, but only once the Vercel GitHub App has been installed on the repository, which
# is an account-level action no workflow can perform. Driving the CLI from here needs three
# repository secrets and nothing else, keeps the build in the same place as the checks that
# gate it, and means a deployment cannot happen on a commit whose CI is red - because this
# job runs the same commands CI does before it publishes anything.
#
# The secrets are `VERCEL_TOKEN`, `VERCEL_ORG_ID` and `VERCEL_PROJECT_ID`. None of them is
# committed; `vercel pull` fetches the project's settings with them and writes them to a
# gitignored `.vercel/` directory.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One production deployment at a time, and a newer push supersedes an older one rather
  # than queueing behind it: the later commit is the one anybody wanted deployed.
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  production:
    name: production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://amasario-explorer.vercel.app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same gate CI applies, repeated here rather than assumed. A deployment job that
      # trusted a separate workflow's green tick would publish whatever the commit says
      # when that workflow was skipped, and the manifest check in particular is the one
      # thing standing between an edited fixture and a page that shows it.
      - name: Typecheck, test and verify the vendored documents
        run: |
          npm run typecheck
          npm test
          npm run verify:manifest

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull the project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build for Vercel
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        id: deploy
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "deployed ${url}"

      # The deployment is only useful if it answers, so it is fetched before the job reports
      # success. A deploy step that exits zero on an upload and never requests the result is
      # a step that cannot tell a working site from a static 404.
      #
      # The alias is checked, not `${{ steps.deploy.outputs.url }}`. That URL is behind
      # Vercel's deployment protection and answers a 302 into an SSO flow - which is correct
      # and deliberate, since a deployment nobody has promoted is not meant to be publicly
      # reachable. An earlier version of this step fetched it anyway and reported a working
      # deployment as a failure, twice, for two different reasons: first a 302 because
      # redirects were not followed, then a 404 at the end of the login redirect it was
      # following into. A check whose subject is unreachable by design cannot fail for a
      # reason that means anything.
      #
      # The alias is what the README, the badge and the repository homepage point at, so it
      # is the address that has to work.
      - name: The production alias answers
        env:
          PRODUCTION_URL: https://amasario-explorer.vercel.app
        run: |
          set -euo pipefail
          status=""
          # The alias can lag the deployment by a moment while Vercel promotes it, so this
          # is a bounded wait rather than a single request. Six attempts over a minute is
          # long enough for a promotion and short enough to fail a genuinely broken deploy.
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -s -o /tmp/index.html -w '%{http_code}' "${PRODUCTION_URL}/")"
            if [ "${status}" = "200" ]; then
              echo "attempt ${attempt}: ${PRODUCTION_URL} answered 200"
              break
            fi
            echo "attempt ${attempt}: ${PRODUCTION_URL} returned HTTP ${status}; waiting"
            sleep 10
          done

          if [ "${status}" != "200" ]; then
            echo "::error title=The production alias did not answer::${PRODUCTION_URL} returned \
          HTTP ${status} after six attempts over a minute"
            exit 1
          fi
          if ! grep -q "Amasario" /tmp/index.html; then
            echo "::error title=The alias served the wrong page::${PRODUCTION_URL} answered 200 \
          but the body does not mention the product"
            exit 1
          fi
          echo "::notice title=Deployed::${PRODUCTION_URL} is serving this commit"
